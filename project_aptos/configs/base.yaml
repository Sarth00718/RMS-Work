# ============================================================
# Collaborative Differentially Private Federated Learning
# Framework for the Prediction of Diabetic Retinopathy
# ============================================================
# Configuration for APTOS 2019 Blindness Detection Dataset
# Paper: IEEE ICAIC 2023 - Hossain, Puppala, Talukder
# ============================================================

# ============================================================
# Dataset Configuration (APTOS 2019)
# ============================================================
dataset:
  name: "APTOS2019"
  root_dir: "../aptos_dataset"
  train_images: "train_images/train_images"
  val_images: "val_images/val_images"
  test_images: "test_images/test_images"
  train_labels: "train_1.csv"
  val_labels: "valid.csv"
  test_labels: "test.csv"
  image_extension: ".png"
  id_column: "id_code"
  label_column: "diagnosis"
  num_classes: 5
  class_names:
    - "No DR"
    - "Mild"
    - "Moderate"
    - "Severe"
    - "Proliferative DR"
  task: "multiclass"  # "multiclass" or "binary"

# ============================================================
# Preprocessing (Paper Specification)
# ============================================================
preprocessing:
  image_size: 224
  # ImageNet normalization (standard for pretrained models)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# ============================================================
# Data Augmentation
# ============================================================
augmentation:
  train:
    random_horizontal_flip: true
    random_vertical_flip: true
    random_rotation: 15
    color_jitter: true
    random_resized_crop: true
  val:
    center_crop: true

# ============================================================
# Data Split
# ============================================================
split:
  # APTOS dataset comes pre-split (train/val/test)
  # We use the provided splits directly
  val_ratio: 0.2  # Only used if val set is not provided
  stratify: true
  random_seed: 42

# ============================================================
# Model Configuration (Paper: ResNet50)
# ============================================================
model:
  architecture: "resnet50"
  pretrained: true
  freeze_backbone: false
  dropout: 0.0
  num_classes: 5

# ============================================================
# Training Configuration
# ============================================================
training:
  epochs: 10
  batch_size: 16
  optimizer: "sgd"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  gradient_clip: 0.0

  # Learning rate scheduler
  scheduler:
    name: "cosine"        # cosine annealing as per paper
    T_max: 50
    eta_min: 0.00001

  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"

  # Checkpointing
  save_best: true
  save_last: true

# ============================================================
# Loss Function
# ============================================================
loss:
  name: "cross_entropy"
  label_smoothing: 0.1
  class_weights: null  # Computed automatically for imbalanced data

# ============================================================
# Federated Learning Configuration (Paper)
# ============================================================
federated:
  num_clients: 3            # K=3 clients (hospitals)
  rounds: 10                # Communication rounds
  local_epochs: 1           # Local epochs per round
  dp_clip_norm: 1.0         # Gradient clipping bound C
  # Noise multipliers from the paper: 0.56, 0.9, 1.2, 3.5, 8.0
  noise_multipliers: [0.56, 0.9, 1.2, 3.5, 8.0]
  # Checkpointing parameters (paper's Algorithm 1)
  checkpoint_theta: 0.01    # Threshold for Checkpoint 1
  checkpoint_phi: 0.01      # Threshold for Checkpoint 2

# ============================================================
# Balanced Sampling (Paper Key Insight)
# ============================================================
sampling:
  use_balanced_sampling: true  # WeightedRandomSampler for imbalanced data

# ============================================================
# Reproducibility
# ============================================================
seed: 42

# ============================================================
# Logging
# ============================================================
logging:
  log_interval: 10
  save_dir: "results"
  experiment_name: "APTOS_baseline"
