# Base Paper Reproduction Configuration
# Paper: Collaborative Differentially Private FL for DR Prediction
# This config reproduces the paper's centralized (no-noise) ResNet50 baseline

# ============================================================
# Dataset Configuration
# ============================================================
dataset:
  name: "IDRiD"
  root_dir: "../B. Disease Grading"
  train_images: "1. Original Images/a. Training Set"
  test_images: "1. Original Images/b. Testing Set"
  train_labels: "2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv"
  test_labels: "2. Groundtruths/b. IDRiD_Disease Grading_Testing Labels.csv"
  num_classes: 5  # Will be overridden for binary
  class_names:
    - "No DR"
    - "Mild"
    - "Moderate"
    - "Severe"
    - "Proliferative DR"
  task: "multiclass"  # "multiclass" or "binary"

# ============================================================
# Preprocessing (Paper Specification)
# ============================================================
preprocessing:
  image_size: 224
  # ImageNet normalization (standard for pretrained models)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# ============================================================
# Data Augmentation (Baseline - Minimal)
# ============================================================
augmentation:
  train:
    random_horizontal_flip: true
    random_vertical_flip: false
    random_rotation: 0  # degrees
    color_jitter: false
    random_resized_crop: false
  val:
    # No augmentation for validation/test
    center_crop: true

# ============================================================
# Data Split
# ============================================================
split:
  # Paper uses 80/20 train/test
  # We'll create validation from training set
  val_ratio: 0.2
  stratify: true
  random_seed: 42

# ============================================================
# Model Configuration (Paper: ResNet50)
# ============================================================
model:
  architecture: "resnet50"
  pretrained: true
  freeze_backbone: false
  dropout: 0.0
  num_classes: 5  # Overridden by dataset.num_classes

# ============================================================
# Training Configuration
# ============================================================
training:
  epochs: 50
  batch_size: 16  # Adjusted for CPU/small dataset
  optimizer: "sgd"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  gradient_clip: 0.0  # 0 = disabled
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"
  
  # Checkpointing
  save_best: true
  save_last: true

# ============================================================
# Loss Function
# ============================================================
loss:
  name: "cross_entropy"
  label_smoothing: 0.0
  class_weights: null  # Will be computed if needed

# ============================================================
# Learning Rate Scheduler
# ============================================================
scheduler:
  name: "none"  # Baseline: no scheduler (paper doesn't specify)

# ============================================================
# Reproducibility
# ============================================================
seed: 42

# ============================================================
# Logging
# ============================================================
logging:
  log_interval: 5  # Print every N batches
  save_dir: "results"
  experiment_name: "baseline"
